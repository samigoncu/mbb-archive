services:
  postgres:
    image: postgres:18-alpine
    container_name: mbb-archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mbb_archive_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: mbb-archive-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - mbb_archive_rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:1.5.4
    # The pinned upstream image publishes amd64 only; Apple Silicon uses Docker emulation.
    platform: linux/amd64
    container_name: mbb-archive-clamav
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 2048M
      CLAMD_CONF_MaxFileSize: 2048M
      CLAMD_CONF_MaxScanSize: 2048M
      CLAMD_CONF_MaxScanTime: 600000
      CLAMD_CONF_AlertExceedsMax: "yes"
    ports:
      - "3310:3310"
    volumes:
      - mbb_archive_clamav_db:/var/lib/clamav

  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: mbb-archive-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - mbb_archive_opensearch:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    container_name: mbb-archive-opensearch-dashboards
    restart: unless-stopped
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      - opensearch

volumes:
  mbb_archive_postgres:
  mbb_archive_rabbitmq:
  mbb_archive_clamav_db:
  mbb_archive_opensearch:
